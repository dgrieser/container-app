# Which apps to build out of this one container.
#
# Every entry under `variants:` becomes its own product flavour, its own
# applicationId and its own APK, so all of them can be installed on the same
# device at the same time. They share all the code — only the values below
# differ, which is what makes one build look like "Container" and another like
# a single-purpose kiosk for one page.
#
# The release pipeline (.github/workflows/android-release_ci.yml) reads this
# file and publishes one signed APK per variant when a tag is pushed.
#
# Keys per variant (unknown keys fail the build, so typos are caught):
#
#   id                 required. Internal name: [a-z][a-z0-9]*. Becomes the
#                      Gradle flavour (`assemble<Id>Release`) and, unless
#                      `applicationId` says otherwise, the applicationId suffix.
#   name               required. The launcher label the user sees.
#   configUrl          required, unless `defaultKioskPath` is an absolute URL —
#                      such a variant needs no kiosk.json and opens that page
#                      directly. The admin menu can still point it at one later.
#   applicationId      optional. Full override. Default: <base>.<id>, or the
#                      bare base id for the variant marked `default: true`.
#   default            optional (false). Marks the variant Android Studio
#                      selects, and the one that keeps the bare applicationId.
#   versionNameSuffix  optional. Appended to the version name, e.g. "-portal".
#   defaultKioskPath   optional. Which page to open first: an absolute https URL,
#                      a path such as "/dashboard", or an app name from the
#                      kiosk.json. Empty = the first app in the kiosk.json.
#   requirePin         optional (true). false = no PIN setup on first run and
#                      the admin menu opens straight away.
#   showMenu           optional (true). false = no hamburger button; the app
#                      shows a single page and cannot be switched (the admin
#                      menu is then reached by long-pressing the bottom-right
#                      corner).
#   screenMode         optional (fullscreen). Which of Android's own bars stay on
#                      screen over the page:
#                        fullscreen    — neither bar; the page owns the display.
#                        statusBar     — top bar (clock, battery, notifications)
#                                        stays, navigation bar hidden.
#                        navigationBar — navigation bar stays, status bar hidden.
#                        systemBars    — both stay, page between them.
#                      A hidden bar can still be swiped in for a moment. This is
#                      only the starting point: the admin menu can change it per
#                      device.
#   barColor.light     optional (#FFFFFF). Colour of the bars `screenMode` keeps,
#   barColor.dark      while the device is in light / in dark mode. #RRGGBB or
#                      #AARRGGBB. Set them to whatever the page shows at that
#                      edge, so the strip reads as part of it; the icons in the
#                      bar are darkened or lightened to suit. Irrelevant for a
#                      fullscreen variant, which has no bar to paint.
#   allowUnverifiedSsl optional (false). true = ship with "allow unverified
#                      certificates" already on, for kiosks against a server
#                      with a self-signed certificate or an internal CA. The
#                      admin switch can still turn it off per device.
#   allowExternalNavigation
#                      optional (false). false = a link leaving the page's own
#                      domain is refused, and the user is told so. true = such a
#                      link is handed to Android's default handler instead, so it
#                      opens in the browser (or whichever app claims it) while
#                      this app stays on its own page. Either way the off-domain
#                      page never loads inside the container.
#   allowLocation      optional (false). true = the page may ask for the device's
#                      position, and the build declares the location permissions
#                      (fine and coarse, plus GPS as an optional feature) that
#                      makes possible. false = the APK carries no location
#                      permission at all and `navigator.geolocation` fails.
#                      Fixed per build; a granted permission is revoked, as for
#                      any app, in Android's own settings. A page inside the
#                      anchored domain is the only one that can ask.
#   icon.glyph         optional (container). One of: container, equalizer, apps,
#                      dashboard, list, menu, home, monitor, chat, info, lock,
#                      bolt, star, circle, square, triangle, diamond.
#   icon.vector        optional. Path (from the repo root) to your own 108x108
#                      vector drawable to use instead of a glyph.
#   icon.background    optional (#1F6FEB). Icon background colour.
#   icon.tint          optional (#FFFFFF). Glyph colour.

# Base for generated applicationIds; must match the module namespace.
applicationId: de.davidgrieser.container

variants:
  # The full container: remote app list, hamburger menu, PIN-protected admin.
  - id: container
    default: true
    name: Container
    configUrl: https://david-grieser.de/kiosk.json
    icon:
      glyph: container
      background: "#1F6FEB"

  # Example of a single-purpose build: one page, no menu, no PIN, and no
  # kiosk.json — the page is pinned here. It lives on a local host with a
  # self-signed certificate, so unverified certificates are on from the start.
  - id: podcaster
    name: Podcaster
    defaultKioskPath: https://raspberrypi/podcaster
    requirePin: false
    showMenu: false
    allowUnverifiedSsl: true
    versionNameSuffix: "-podcaster"
    icon:
      glyph: equalizer
      background: "#0E1714"
      tint: "#F2B33D"

  # Another single-page build: one pinned page, no menu, no PIN, no kiosk.json.
  # Its host has a certificate the device can verify, so unlike Podcaster it
  # leaves `allowUnverifiedSsl` at its safe default. It does open its off-domain
  # links, though: they leave for the browser rather than being refused, because
  # the page links out to places worth following. Its symbol is also the first
  # that is not a built-in glyph but the site's own artwork, checked in as a
  # vector drawable and used as the icon foreground verbatim — which is why no
  # `tint` is given here: that drawable carries its own colours. It is also the
  # first variant that is not edge-to-edge: `screenMode: statusBar` keeps the
  # clock, the battery and the notifications above the page, which suits a build
  # that is read like a website rather than staring at a wall as a dashboard. The
  # strip they sit in is painted in the colour the page itself has at its top
  # edge, sampled from the site in each theme — the near-white of its light mode,
  # the near-black of its dark one — so the bar reads as part of the page and its
  # icons flip from dark to light along with it. Its page also wants to know
  # where the device is, to answer "cheapest right now" for somewhere in
  # particular, so it is built with `allowLocation: true` — the only build whose
  # APK declares a location permission at all.
  - id: gasoline
    name: Gasoline
    defaultKioskPath: https://gasoline.david-grieser.de/
    requirePin: false
    showMenu: false
    allowExternalNavigation: true
    allowLocation: true
    screenMode: statusBar
    barColor:
      light: "#F4F2ED"
      dark: "#0D0E11"
    versionNameSuffix: "-gasoline"
    icon:
      vector: app-icons/gasoline.xml
      background: "#22303F"
