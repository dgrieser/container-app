name: Variants CI

# The check that keeps the two platforms describing the same app. It runs on
# every pull request and costs nothing: all of it is Linux except one simulator
# build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  parsers-agree:
    name: Both parsers read app-variants.yaml the same way
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install the generator's dependencies
        run: pip3 install --quiet -r ios/tools/requirements.txt

      # The Kotlin side: the strict parser, the schema-sync test and the shared
      # accept/reject corpus. No Android SDK needed, so it runs here.
      - name: buildSrc tests
        working-directory: android
        run: ./gradlew --console=plain -p buildSrc test

      # The Python side: the same corpus, the version arithmetic, the icons, the
      # plists, and the contract between the generator and VariantConfig.swift.
      - name: Generator tests
        working-directory: ios/tools
        run: python3 -m unittest discover -s tests -t . -v

      - name: Generate the iOS project files
        run: python3 ios/tools/generate.py

      # The check no key- or enum-level comparison can make: whether the two
      # parsers apply the same *defaults*.
      - name: The two parsers produce the same model
        run: |
          cd android && ./gradlew --console=plain -q dumpVariantsJson > /dev/null && cd ..
          python3 ios/tools/generate.py --dump-json > /tmp/ios-variants.json
          if ! diff -u android/build/variants.json /tmp/ios-variants.json; then
            echo "::error::AppVariants.kt and ios/tools/variants.py disagree about app-variants.yaml"
            exit 1
          fi
          echo "Both parsers agree."

      - name: The release matrix still reads
        run: python3 .github/scripts/list_variants.py

  ios-compiles:
    name: iOS builds (simulator, no signing)
    runs-on: macos-14
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the generator's dependencies
        run: |
          brew install cairo
          pip3 install --quiet -r ios/tools/requirements.txt

      - name: Generate the project
        working-directory: ios
        run: make project

      # A simulator build needs no signing material at all, which is what makes
      # this the cheapest possible check that the Swift actually compiles.
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project Container.xcodeproj \
            -scheme container \
            -destination 'platform=iOS Simulator,name=iPhone 15'

      # Every variant compiles, not only the default one: a per-variant Info.plist
      # or asset catalogue can be wrong on its own.
      - name: Build the other variants
        working-directory: ios
        run: |
          for scheme in podcaster gasoline; do
            echo "::group::$scheme"
            xcodebuild build \
              -project Container.xcodeproj \
              -scheme "$scheme" \
              -destination 'platform=iOS Simulator,name=iPhone 15'
            echo "::endgroup::"
          done
