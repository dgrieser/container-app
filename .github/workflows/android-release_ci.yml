name: Android Release CI

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  variants:
    name: Read app variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2

      - name: Read app-variants.yaml
        id: read
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          matrix="$(python3 .github/scripts/list_variants.py)"
          echo "Building variants: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build, Sign & Release (${{ matrix.variant.name }})
    needs: variants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.matrix) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # The pushed tag is the version: it becomes versionName, and versionCode
        # is derived from it, so each release supersedes the last on a device.
        run: |
          ./gradlew clean assemble${{ matrix.variant.gradleName }}Release \
            -PappVersion="${{ github.ref_name }}"

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant.id }}/release
          signingKey: ${{ secrets.SIGNINGKEY_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Release to GitHub
        uses: svenstaro/upload-release-action@2.11.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.sign_app.outputs.signedFile }}
          asset_name: container-app-${{ matrix.variant.id }}-${{ github.ref_name }}-signed.apk
          tag: ${{ github.ref }}
          overwrite: true
