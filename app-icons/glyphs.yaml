# The built-in symbols an app variant can pick for its launcher icon
# (`icon.glyph` in ../app-variants.yaml).
#
# Every entry is the `pathData` of a Material-style icon drawn in a 24x24
# viewport. That is also SVG path data, unchanged, which is why one file can
# serve both platforms: the Android build scales and centres it inside the
# 108x108 adaptive-icon canvas, and the iOS generator drops the same string into
# an <svg viewBox="0 0 24 24"> and rasterises it.
#
# Read by:
#   android/buildSrc/src/main/kotlin/LauncherGlyphs.kt
#   ios/tools/glyphs.py
#
# The key order is the order the names are listed in the README and in error
# messages, so keep it meaningful rather than alphabetical. A variant that needs
# something else points `icon.vector` at its own drawable instead and never
# looks here.

# The original Container icon: a framed bar chart.
